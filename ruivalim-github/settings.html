<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- GitHub (Rui) custom settings area (drawn by the plugin, cindy-ghost:// sandbox page).
     This unofficial copy authenticates only with a pasted Personal Access Token: the
     host's local GitHub CLI login (secret source gh-cli) is reserved for the official
     cindy-github id. The PAT goes to the host vault once through the write-only
     /secrets channel (afterwards this page can only read back saved + a 4-character
     tail fingerprint, never the plain text).
     "Test connection" is run by the brain: this page calls fetch('/wake') to wake it,
     relays through BroadcastChannel, the brain does cindy.fetch GET /user (the host
     injects the PAT) and broadcasts the username back. This page makes no direct
     network calls, and token bytes never pass through anything readable. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    padding: 2px 0 0;
    color: var(--text-primary, #1a1a1a);
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* Title and console link are indented 2px to line up with the text edge of the pill input (same as xd-mivo). */
  .label-row { display: flex; align-items: center; gap: 8px; padding-left: 2px; }
  .label-row .name { font-weight: 500; }
  .hint { margin: 7px 2px 0; font-size: 12px; color: var(--text-tertiary, #8a8a86); }
  .badge {
    padding: 1px 8px; border-radius: 6px; font-size: 11px;
    background: var(--surface-chip, #efefec); color: var(--text-tertiary, #8a8a86);
  }
  /* Console link: primary text color (white in dark theme), matching the xd-mivo settings link.
     href matches network.secrets[].url in the manifest exactly; a click goes through the host's
     external link gate to the system browser (undeclared URLs are blocked, so the click does nothing). */
  .console-link {
    display: inline-block; margin-top: 8px; margin-left: 2px;
    font-size: 12px; font-weight: 500;
    color: var(--text-primary, #1a1a1a); text-decoration: none;
  }
  .console-link:hover { text-decoration: underline; text-underline-offset: 2px; }
  .input-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  /* Pill input + eye toggle, styled exactly like the xd-mivo settings page. */
  .pill {
    display: flex; flex: 1 1 auto; align-items: center; height: 32px;
    border: 1px solid var(--border-default, #e4e4e0); border-radius: 999px;
    background: var(--surface-elevated, #ffffff); padding: 0 4px 0 12px;
  }
  .pill:focus-within { border-color: var(--focus-ring, #4c8dff); }
  .pill input {
    flex: 1 1 auto; min-width: 0; border: 0; outline: none; background: transparent;
    color: var(--text-primary, #1a1a1a); font: inherit;
  }
  .pill input::placeholder { color: var(--text-placeholder, #a8a8a4); }
  .icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border: 0; border-radius: 999px;
    background: transparent; color: var(--text-tertiary, #8a8a86); cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface-chip, #efefec); }
  /* Hide the eye when the input is empty (saved values cannot be read back, so it would do nothing); keep its space so the row does not jump on the first keystroke. */
  .icon-btn.hidden { visibility: hidden; pointer-events: none; }
  .icon-btn svg { width: 14px; height: 14px; }
  .icon-btn .off { display: none; }
  .icon-btn.revealed .on { display: none; }
  .icon-btn.revealed .off { display: block; }
  .btn {
    padding: 5px 16px; border-radius: 999px; cursor: pointer; flex: 0 0 auto;
    border: 1px solid var(--border-default, #e4e4e0);
    background: transparent; color: var(--text-primary, #1a1a1a);
    font: inherit; font-weight: 500;
  }
  .btn:hover { background: var(--surface-chip, #efefec); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .account {
    display: flex; align-items: center; gap: 8px; margin-top: 8px;
    padding: 6px 12px; border: 1px solid var(--border-default, #e4e4e0);
    border-radius: 10px; background: var(--surface-elevated, #ffffff);
  }
  .account .who { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .account .tag { font-size: 11px; color: var(--text-tertiary, #8a8a86); flex: 0 0 auto; }
  .account .mini {
    padding: 2px 10px; border-radius: 999px; font-size: 11px; cursor: pointer; flex: 0 0 auto;
    border: 1px solid var(--border-default, #e4e4e0); background: transparent;
    color: var(--text-secondary, #55554f); font-family: inherit;
  }
  .account .mini:hover { background: var(--surface-chip, #efefec); }
  #status { margin-top: 8px; font-size: 11px; color: var(--text-tertiary, #8a8a86); min-height: 16px; }
  #status:empty { display: none; }
</style>
</head>
<body>
  <div class="label-row">
    <span class="name">GitHub token</span>
    <span class="badge">github.com</span>
  </div>
  <p class="hint">Paste a GitHub personal access token. It is stored in the host vault and only sent to api.github.com. This unofficial copy cannot use your computer's GitHub CLI login; Cindy reserves that for the official GitHub plugin.</p>
  <div id="token-account"></div>
  <div class="input-row" id="token-row">
    <div class="pill">
      <input id="token" type="password" placeholder="ghp_... or github_pat_..." autocomplete="off" spellcheck="false">
      <button id="eye" class="icon-btn" type="button" title="Show or hide">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
      </button>
    </div>
    <button id="save" class="btn" type="button">Save</button>
  </div>
  <div class="input-row">
    <button id="test" class="btn" type="button">Test connection</button>
    <button id="clear" class="btn" type="button">Clear</button>
  </div>
  <a class="console-link" href="https://github.com/settings/tokens">Create a token on GitHub ↗</a>
  <p id="status"></p>
  <script src="/settings.js"></script>
</body>
</html>
